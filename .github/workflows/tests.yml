name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      # CPU build of the same torch version as the local CUDA env (GitHub runners have no GPU).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest==9.1.1 numpy==2.5.4

      - name: Run tests
        run: pytest -v
